
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Dashboard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Tashee IT HelpDesk Management System</h1>
    </header>

    <main>
        <section class="welcome">
            <h2>HelpDesk Dashboard</h2>

            <div class="dashboard-cards">
                <div class="card">
                    <h3>Total Tickets</h3>
                    <p>{{ total }}</p>
                </div>

                <div class="card">
                    <h3>Open</h3>
                    <p>{{ open_tickets }}</p>
                </div>

                <div class="card">
                    <h3>In Progress</h3>
                    <p>{{ in_progress }}</p>
                </div>

                <div class="card">
                    <h3>Resolved</h3>
                    <p>{{ resolved }}</p>
                </div>
            </div>

            <p><a href="/tickets">View All Tickets</a></p>
            <p><a href="/">Back to Home</a></p>
        </section>
    </main>
</body>
</html>
